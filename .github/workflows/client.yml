name: Client

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: client (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, ext: "" }
          - { name: windows-x86_64, os: windows-latest, ext: ".exe" }
          - { name: macos-arm64, os: macos-latest, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo build --release --locked -p kikonnect-client
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/kikonnect-client${{ matrix.ext }} dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../kikonnect-client-${{ matrix.name }}.zip kikonnect-client.exe
          else
            tar czf ../kikonnect-client-${{ matrix.name }}.tar.gz kikonnect-client
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kikonnect-client-${{ matrix.name }}
          path: kikonnect-client-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
